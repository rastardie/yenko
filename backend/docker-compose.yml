services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: yenko
      POSTGRES_PASSWORD: yenko_local_only
      POSTGRES_DB: yenko_development
    ports:
      - "5433:5432"
    volumes:
      - yenko_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yenko -d yenko_development"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  yenko_postgres_data:
